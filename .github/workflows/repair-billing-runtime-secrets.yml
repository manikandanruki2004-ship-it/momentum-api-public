name: Repair Billing Runtime Secrets

on:
  workflow_run:
    workflows: ["Deploy Momentum Stack"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: momentum-billing-runtime-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify required deployment secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          MOMENTUM_API_KEY_PEPPER: ${{ secrets.MOMENTUM_API_KEY_PEPPER }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_PRO_PLAN_ID: ${{ secrets.RAZORPAY_PRO_PLAN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$RAZORPAY_KEY_ID" || { echo "Missing RAZORPAY_KEY_ID"; exit 1; }
          test -n "$RAZORPAY_KEY_SECRET" || { echo "Missing RAZORPAY_KEY_SECRET"; exit 1; }
          test -n "$MOMENTUM_API_KEY_PEPPER" || { echo "Missing MOMENTUM_API_KEY_PEPPER"; exit 1; }
          test -n "$RAZORPAY_WEBHOOK_SECRET" || { echo "Missing RAZORPAY_WEBHOOK_SECRET"; exit 1; }
          test -n "$RAZORPAY_PRO_PLAN_ID" || { echo "Missing RAZORPAY_PRO_PLAN_ID"; exit 1; }
          echo "Required billing deployment secrets are configured."

      - name: Install Razorpay runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          MOMENTUM_API_KEY_PEPPER: ${{ secrets.MOMENTUM_API_KEY_PEPPER }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_TEST_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_TEST_WEBHOOK_SECRET }}
          RAZORPAY_PRO_PLAN_ID: ${{ secrets.RAZORPAY_PRO_PLAN_ID }}
          RAZORPAY_TEST_PRO_PLAN_ID: ${{ secrets.RAZORPAY_TEST_PRO_PLAN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1" value="$2"
            printf '%s' "$value" | npx --yes wrangler@4.129.0 secret put "$name" --name momentum-billing
          }
          put_secret RAZORPAY_KEY_ID "$RAZORPAY_KEY_ID"
          put_secret RAZORPAY_KEY_SECRET "$RAZORPAY_KEY_SECRET"
          put_secret API_KEY_PEPPER "$MOMENTUM_API_KEY_PEPPER"
          put_secret RAZORPAY_WEBHOOK_SECRET "$RAZORPAY_WEBHOOK_SECRET"
          if [ -n "${RAZORPAY_TEST_WEBHOOK_SECRET:-}" ]; then put_secret RAZORPAY_TEST_WEBHOOK_SECRET "$RAZORPAY_TEST_WEBHOOK_SECRET"; fi
          put_secret RAZORPAY_PRO_PLAN_ID "$RAZORPAY_PRO_PLAN_ID"
          if [ -n "${RAZORPAY_TEST_PRO_PLAN_ID:-}" ]; then put_secret RAZORPAY_TEST_PRO_PLAN_ID "$RAZORPAY_TEST_PRO_PLAN_ID"; fi

      - name: Verify billing health after secret sync
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://momentum-api-public.manikandanruki2004.workers.dev"
          STATUS="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --output /tmp/billing-health.json --write-out '%{http_code}' --retry 5 --retry-delay 3 "$BASE/billing/health")"
          echo "HTTP $STATUS"
          cat /tmp/billing-health.json
          echo
          test "$STATUS" = "200"
          jq -e '.status == "ok" and .service == "momentum-billing"' /tmp/billing-health.json >/dev/null
          echo "Billing runtime secret repair verified."
