name: Apply Production D1 Migrations

on:
  push:
    branches: [main]
    paths:
      - 'worker/migrations/**'
      - '.github/workflows/db-migrations.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: momentum-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate migration sequence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find worker/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort)
          test "${#migrations[@]}" -gt 0
          expected=1
          for migration in "${migrations[@]}"; do
            number="${migration:0:4}"
            actual=$((10#$number))
            test "$actual" -eq "$expected" || { echo "Migration sequence gap: expected $(printf '%04d' "$expected"), found $number"; exit 1; }
            expected=$((expected + 1))
          done
          test -f worker/migrations/0018_billing_entitlement_sync_triggers.sql
          test -f worker/migrations/0019_rebuild_billing_entitlement_sync_triggers.sql

      - name: Install Wrangler
        working-directory: worker
        run: npx --yes wrangler@4.129.0 --version

      - name: Resolve production D1 and build deployment config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" > /tmp/d1.json
          jq -e '.success == true' /tmp/d1.json >/dev/null
          DB_ID="$(jq -r '.result[] | select(.name == "momentum-production") | .uuid' /tmp/d1.json | head -n 1)"
          test -n "$DB_ID"
          node - "$DB_ID" <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          base.d1_databases = [{ binding: 'DB', database_name: 'momentum-production', database_id: process.argv[2], migrations_dir: 'migrations' }];
          base.workers_dev = true;
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify(base, null, 2));
          NODE

      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx --yes wrangler@4.129.0 d1 migrations apply momentum-production --remote --config wrangler.deploy.json
