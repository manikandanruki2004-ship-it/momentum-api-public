name: Apply Production D1 Migrations

on:
  push:
    branches: [main]
    paths:
      - 'worker/migrations/**'
      - '.github/workflows/db-migrations.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Resolve production D1 and build deployment config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" > /tmp/d1.json
          DB_ID="$(jq -r '.result[] | select(.name == "momentum-production") | .uuid' /tmp/d1.json | head -n 1)"
          test -n "$DB_ID"
          node - "$DB_ID" <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          base.d1_databases = [{ binding: 'DB', database_name: 'momentum-production', database_id: process.argv[2], migrations_dir: 'migrations' }];
          base.workers_dev = true;
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify(base, null, 2));
          NODE

      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx wrangler d1 migrations apply momentum-production --remote --config wrangler.deploy.json
