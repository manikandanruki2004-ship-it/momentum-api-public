name: Configure Razorpay Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create billing Wrangler config
        working-directory: billing
        run: |
          cat > wrangler.deploy.json <<'EOF'
          {
            "name": "momentum-billing",
            "main": "src/index.ts",
            "compatibility_date": "2026-08-25",
            "workers_dev": true
          }
          EOF

      - name: Install Razorpay API credentials and active plan
        working-directory: billing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_PRO_PLAN_ID: ${{ secrets.RAZORPAY_PRO_PLAN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAZORPAY_KEY_ID"
          test -n "$RAZORPAY_KEY_SECRET"
          test -n "$RAZORPAY_PRO_PLAN_ID"

          printf '%s' "$RAZORPAY_KEY_ID" | npx wrangler secret put RAZORPAY_KEY_ID --config wrangler.deploy.json
          printf '%s' "$RAZORPAY_KEY_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET --config wrangler.deploy.json
          printf '%s' "$RAZORPAY_PRO_PLAN_ID" | npx wrangler secret put RAZORPAY_PRO_PLAN_ID --config wrangler.deploy.json

      - name: Verify Razorpay credentials and active plan
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_PRO_PLAN_ID: ${{ secrets.RAZORPAY_PRO_PLAN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -u "$RAZORPAY_KEY_ID:$RAZORPAY_KEY_SECRET" \
            "https://api.razorpay.com/v1/plans/$RAZORPAY_PRO_PLAN_ID" \
            -o /tmp/plan.json
          jq -e --arg id "$RAZORPAY_PRO_PLAN_ID" '.id == $id' /tmp/plan.json >/dev/null
          echo "Razorpay credentials and configured Pro plan verified."