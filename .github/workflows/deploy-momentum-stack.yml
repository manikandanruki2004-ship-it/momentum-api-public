name: Deploy Momentum Stack

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-momentum-stack.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: momentum-stack-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout public gateway
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private engine
        uses: actions/checkout@v4
        with:
          repository: manikandanruki2004-ship-it/momentum-engine
          token: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}
          path: _private-engine
          persist-credentials: false

      - name: Harden private engine rate limiter
        working-directory: _private-engine
        env:
          MOMENTUM_GITHUB_TOKEN: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('worker/src/index.ts')
          text = source.read_text(encoding='utf-8')
          old = '''async function enforceRateLimit(customer: Customer, keyHash: string, env: Env): Promise<boolean> {
  const bucket = Math.floor(Date.now() / 60000);
  const key = `rl:${keyHash}:${bucket}`;
  const current = Number((await env.RATE_LIMIT.get(key)) ?? "0");
  if (current >= customer.rate_limit_per_minute) return false;
  await env.RATE_LIMIT.put(key, String(current + 1), { expirationTtl: 120 });
  return true;
}'''
          new = '''async function enforceRateLimit(customer: Customer, _keyHash: string, env: Env): Promise<boolean> {
  // D1 provides a strongly consistent atomic update for this per-customer bucket.
  // KV is retained for future use, but is not used for enforcement because KV reads/writes
  // are eventually consistent and can allow bursts through a strict limit.
  const bucket = Math.floor(Date.now() / 60000);
  const result = await env.DB.prepare(
    `UPDATE customers
     SET rate_window = ?,
         rate_count = CASE WHEN rate_window = ? THEN rate_count + 1 ELSE 1 END
     WHERE id = ? AND active = 1
       AND (CASE WHEN rate_window = ? THEN rate_count ELSE 0 END) < rate_limit_per_minute`,
  ).bind(bucket, bucket, customer.id, bucket).run();
  return result.meta.changes === 1;
}'''

          changed = False
          if old in text:
              text = text.replace(old, new, 1)
              source.write_text(text, encoding='utf-8')
              changed = True
          elif 'SET rate_window = ?' not in text:
              raise SystemExit('Expected rate limiter source was not found; refusing to guess-edit the private engine.')

          migration = Path('worker/migrations/0003_atomic_rate_limit.sql')
          if not migration.exists():
              migration.write_text('''ALTER TABLE customers ADD COLUMN rate_window INTEGER NOT NULL DEFAULT 0;
ALTER TABLE customers ADD COLUMN rate_count INTEGER NOT NULL DEFAULT 0;
''', encoding='utf-8')
              changed = True

          if changed:
              subprocess.run(['git', 'config', 'user.name', 'Momentum CI'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', 'worker/src/index.ts', 'worker/migrations/0003_atomic_rate_limit.sql'], check=True)
              subprocess.run(['git', 'commit', '-m', 'fix: make per-key rate limiting atomic'], check=True)
              subprocess.run([
                  'git', 'remote', 'set-url', 'origin',
                  f'https://x-access-token:{__import__("os").environ["MOMENTUM_GITHUB_TOKEN"]}@github.com/manikandanruki2004-ship-it/momentum-engine.git'
              ], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
              print('Private engine rate limiter hardened and persisted.')
          else:
              print('Private engine already contains the atomic rate limiter fix.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            worker/package.json
            _private-engine/worker/package.json

      - name: Install gateway dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: _private-engine/worker
        run: npm install --no-audit --no-fund

      - name: Typecheck gateway
        working-directory: worker
        run: npm run typecheck

      - name: Typecheck engine
        working-directory: _private-engine/worker
        run: npm run typecheck

      - name: Provision Cloudflare D1 and KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.cloudflare.com/client/v4"
          DB_NAME="momentum-production"
          KV_TITLE="momentum-rate-limit"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          echo "Discovering D1 database..."
          curl --fail-with-body --silent --show-error \
            "${AUTH[@]}" \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            > /tmp/d1-list.json
          jq -e '.success == true' /tmp/d1-list.json >/dev/null || { cat /tmp/d1-list.json >&2; exit 1; }
          DB_ID="$(jq -r --arg name "$DB_NAME" '.result[] | select(.name == $name) | .uuid' /tmp/d1-list.json | head -n 1)"

          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database $DB_NAME..."
            curl --fail-with-body --silent --show-error -X POST \
              "${AUTH[@]}" \
              "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              --data "{\"name\":\"${DB_NAME}\"}" \
              > /tmp/d1-create.json
            jq -e '.success == true' /tmp/d1-create.json >/dev/null || { cat /tmp/d1-create.json >&2; exit 1; }
            DB_ID="$(jq -r '.result.uuid // empty' /tmp/d1-create.json)"
          fi

          echo "Discovering KV namespace..."
          curl --fail-with-body --silent --show-error \
            "${AUTH[@]}" \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
            > /tmp/kv-list.json
          jq -e '.success == true' /tmp/kv-list.json >/dev/null || { cat /tmp/kv-list.json >&2; exit 1; }
          KV_ID="$(jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id' /tmp/kv-list.json | head -n 1)"

          if [ -z "$KV_ID" ]; then
            echo "Creating KV namespace $KV_TITLE..."
            curl --fail-with-body --silent --show-error -X POST \
              "${AUTH[@]}" \
              "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              --data "{\"title\":\"${KV_TITLE}\"}" \
              > /tmp/kv-create.json
            jq -e '.success == true' /tmp/kv-create.json >/dev/null || { cat /tmp/kv-create.json >&2; exit 1; }
            KV_ID="$(jq -r '.result.id // empty' /tmp/kv-create.json)"
          fi

          if [ -z "$DB_ID" ] || [ -z "$KV_ID" ]; then
            echo "Unable to provision or discover Cloudflare resource IDs." >&2
            exit 1
          fi

          node - "$DB_ID" "$KV_ID" <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          base.d1_databases = [{ binding: 'DB', database_name: 'momentum-production', database_id: process.argv[2], migrations_dir: 'migrations' }];
          base.kv_namespaces = [{ binding: 'RATE_LIMIT', id: process.argv[3] }];
          base.workers_dev = true;
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify(base, null, 2));
          NODE

      - name: Apply engine D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        run: npx wrangler d1 migrations apply momentum-production --remote --config wrangler.deploy.json

      - name: Deploy private engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        run: npx wrangler deploy --config wrangler.deploy.json

      - name: Install private Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOMENTUM_GITHUB_TOKEN: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}
          MOMENTUM_API_KEY_PEPPER: ${{ secrets.MOMENTUM_API_KEY_PEPPER }}
          MOMENTUM_ADMIN_SECRET: ${{ secrets.MOMENTUM_ADMIN_SECRET }}
        working-directory: _private-engine/worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MOMENTUM_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config wrangler.deploy.json
          printf '%s' "$MOMENTUM_API_KEY_PEPPER" | npx wrangler secret put API_KEY_PEPPER --config wrangler.deploy.json
          printf '%s' "$MOMENTUM_ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET --config wrangler.deploy.json

      - name: Deploy public gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx wrangler deploy
