name: Deploy Momentum Stack

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'billing/**'
      - 'worker/migrations/**'
      - '.github/workflows/deploy-momentum-stack.yml'
  workflow_dispatch:
    inputs:
      private_engine_ref:
        description: 'Branch, tag, or commit SHA from momentum-engine to deploy'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: momentum-stack-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout public gateway
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private engine
        uses: actions/checkout@v4
        with:
          repository: therandomhuman-hub/momentum-engine
          token: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}
          ref: ${{ inputs.private_engine_ref || 'main' }}
          path: _private-engine
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            worker/package.json
            billing/package.json
            _private-engine/worker/package.json

      - name: Install gateway dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Install billing dependencies
        working-directory: billing
        run: npm install --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: _private-engine/worker
        run: npm install --no-audit --no-fund

      - name: Typecheck gateway
        working-directory: worker
        run: npm run typecheck

      - name: Typecheck billing
        working-directory: billing
        run: npm run typecheck

      - name: Typecheck engine
        working-directory: _private-engine/worker
        run: npm run typecheck

      - name: Provision Cloudflare D1 and KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.cloudflare.com/client/v4"
          DB_NAME="momentum-production"
          KV_TITLE="momentum-rate-limit"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          echo "Discovering D1 database..."
          curl --fail-with-body --silent --show-error \
            "${AUTH[@]}" \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            > /tmp/d1-list.json
          jq -e '.success == true' /tmp/d1-list.json >/dev/null || { cat /tmp/d1-list.json >&2; exit 1; }
          DB_ID="$(jq -r --arg name "$DB_NAME" '.result[] | select(.name == $name) | .uuid' /tmp/d1-list.json | head -n 1)"

          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database $DB_NAME..."
            curl --fail-with-body --silent --show-error -X POST \
              "${AUTH[@]}" \
              "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              --data "{\"name\":\"${DB_NAME}\"}" \
              > /tmp/d1-create.json
            jq -e '.success == true' /tmp/d1-create.json >/dev/null || { cat /tmp/d1-create.json >&2; exit 1; }
            DB_ID="$(jq -r '.result.uuid // empty' /tmp/d1-create.json)"
          fi

          echo "Discovering KV namespace..."
          curl --fail-with-body --silent --show-error \
            "${AUTH[@]}" \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
            > /tmp/kv-list.json
          jq -e '.success == true' /tmp/kv-list.json >/dev/null || { cat /tmp/kv-list.json >&2; exit 1; }
          KV_ID="$(jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id' /tmp/kv-list.json | head -n 1)"

          if [ -z "$KV_ID" ]; then
            echo "Creating KV namespace $KV_TITLE..."
            curl --fail-with-body --silent --show-error -X POST \
              "${AUTH[@]}" \
              "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              --data "{\"title\":\"${KV_TITLE}\"}" \
              > /tmp/kv-create.json
            jq -e '.success == true' /tmp/kv-create.json >/dev/null || { cat /tmp/kv-create.json >&2; exit 1; }
            KV_ID="$(jq -r '.result.id // empty' /tmp/kv-create.json)"
          fi

          if [ -z "$DB_ID" ] || [ -z "$KV_ID" ]; then
            echo "Unable to provision or discover Cloudflare resource IDs." >&2
            exit 1
          fi

          node - "$DB_ID" "$KV_ID" <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          base.d1_databases = [{ binding: 'DB', database_name: 'momentum-production', database_id: process.argv[2], migrations_dir: 'migrations' }];
          base.kv_namespaces = [{ binding: 'RATE_LIMIT', id: process.argv[3] }];
          base.workers_dev = true;
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify(base, null, 2));
          NODE

      - name: Sync billing migration into engine checkout
        run: cp worker/migrations/0008_razorpay_billing.sql _private-engine/worker/migrations/0008_razorpay_billing.sql

      - name: Apply engine D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        run: npx wrangler d1 migrations apply momentum-production --remote --config wrangler.deploy.json

      - name: Deploy private engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        run: npx wrangler deploy --config wrangler.deploy.json

      - name: Install private Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOMENTUM_GITHUB_TOKEN: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}
          MOMENTUM_API_KEY_PEPPER: ${{ secrets.MOMENTUM_API_KEY_PEPPER }}
          MOMENTUM_ADMIN_SECRET: ${{ secrets.MOMENTUM_ADMIN_SECRET }}
        working-directory: _private-engine/worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MOMENTUM_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config wrangler.deploy.json
          printf '%s' "$MOMENTUM_API_KEY_PEPPER" | npx wrangler secret put API_KEY_PEPPER --config wrangler.deploy.json
          printf '%s' "$MOMENTUM_ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET --config wrangler.deploy.json

      - name: Create billing Worker config
        working-directory: billing
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = {
            name: 'momentum-billing',
            main: 'src/index.ts',
            compatibility_date: '2026-08-25',
            workers_dev: true,
            observability: { enabled: true },
            d1_databases: [{ binding: 'DB', database_name: 'momentum-production', database_id: process.env.DB_ID_PLACEHOLDER || '', migrations_dir: '../worker/migrations' }]
          };
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify(config, null, 2));
          NODE

      - name: Patch billing Worker config with discovered D1 ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail-with-body --silent --show-error "${AUTH[@]}" "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" > /tmp/d1-list-again.json
          DB_ID="$(jq -r --arg name "momentum-production" '.result[] | select(.name == $name) | .uuid' /tmp/d1-list-again.json | head -n 1)"
          test -n "$DB_ID"
          cd ../../../billing
          node - "$DB_ID" <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('wrangler.deploy.json','utf8'));
          p.d1_databases[0].database_id = process.argv[2];
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify(p, null, 2));
          NODE

      - name: Deploy billing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: billing
        run: npx wrangler deploy --config wrangler.deploy.json

      - name: Install billing Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_STARTER_PLAN_ID: ${{ secrets.RAZORPAY_STARTER_PLAN_ID }}
          RAZORPAY_PRO_PLAN_ID: ${{ secrets.RAZORPAY_PRO_PLAN_ID }}
        working-directory: billing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RAZORPAY_WEBHOOK_SECRET" ]; then
            printf '%s' "$RAZORPAY_WEBHOOK_SECRET" | npx wrangler secret put RAZORPAY_WEBHOOK_SECRET --config wrangler.deploy.json
          else
            echo "RAZORPAY_WEBHOOK_SECRET is not configured yet; billing webhook remains disabled."
          fi
          if [ -n "$RAZORPAY_STARTER_PLAN_ID" ]; then
            printf '%s' "$RAZORPAY_STARTER_PLAN_ID" | npx wrangler secret put RAZORPAY_STARTER_PLAN_ID --config wrangler.deploy.json
          fi
          if [ -n "$RAZORPAY_PRO_PLAN_ID" ]; then
            printf '%s' "$RAZORPAY_PRO_PLAN_ID" | npx wrangler secret put RAZORPAY_PRO_PLAN_ID --config wrangler.deploy.json
          fi

      - name: Deploy public gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx wrangler deploy

      - name: Smoke test public gateway
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://momentum-api-public.manikandanruki2004.workers.dev"

          echo "Checking /health..."
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 3 "$BASE_URL/health" | tee /tmp/health.json
          jq -e '.status == "ok" and .service == "momentum-api-public"' /tmp/health.json >/dev/null

          echo "Checking /version..."
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 3 "$BASE_URL/version" | tee /tmp/version.json
          jq -e '.name == "Momentum API"' /tmp/version.json >/dev/null

          echo "Checking /v1/me route protection..."
          ME_STATUS="$(curl --silent --show-error --output /tmp/me.json --write-out '%{http_code}' --retry 5 --retry-delay 3 "$BASE_URL/v1/me")"
          test "$ME_STATUS" = "401"
          jq -e '.error.code == "UNAUTHORIZED"' /tmp/me.json >/dev/null

          echo "Checking Razorpay webhook endpoint is reachable..."
          BILLING_STATUS="$(curl --silent --show-error --output /tmp/razorpay.json --write-out '%{http_code}' --retry 5 --retry-delay 3 -X POST "$BASE_URL/webhooks/razorpay" -H 'Content-Type: application/json' -d '{}')"
          test "$BILLING_STATUS" = "401" -o "$BILLING_STATUS" = "503"

          echo "Public gateway and billing route smoke checks passed."
