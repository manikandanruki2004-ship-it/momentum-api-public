name: Deploy Momentum Stack

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-momentum-stack.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: momentum-stack-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout public gateway
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private engine
        uses: actions/checkout@v4
        with:
          repository: manikandanruki2004-ship-it/momentum-engine
          token: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}
          path: _private-engine
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            worker/package.json
            _private-engine/worker/package.json

      - name: Install gateway dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: _private-engine/worker
        run: npm install --no-audit --no-fund

      - name: Typecheck gateway
        working-directory: worker
        run: npm run typecheck

      - name: Typecheck engine
        working-directory: _private-engine/worker
        run: npm run typecheck

      - name: Provision Cloudflare D1 and KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.cloudflare.com/client/v4"
          DB_NAME="momentum-production"
          KV_TITLE="momentum-rate-limit"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          echo "Discovering D1 database..."
          curl --fail-with-body --silent --show-error \
            "${AUTH[@]}" \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            > /tmp/d1-list.json

          if ! jq -e '.success == true' /tmp/d1-list.json >/dev/null; then
            cat /tmp/d1-list.json >&2
            echo "Cloudflare D1 list failed. Check CLOUDFLARE_API_TOKEN D1 Read/Write permission." >&2
            exit 1
          fi

          DB_ID="$(jq -r --arg name "$DB_NAME" '.result[] | select(.name == $name) | .uuid' /tmp/d1-list.json | head -n 1)"

          if [ -z "$DB_ID" ]; then
            echo "D1 database not found; creating $DB_NAME..."
            curl --fail-with-body --silent --show-error -X POST \
              "${AUTH[@]}" \
              "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              --data "{\"name\":\"${DB_NAME}\"}" \
              > /tmp/d1-create.json

            if ! jq -e '.success == true' /tmp/d1-create.json >/dev/null; then
              cat /tmp/d1-create.json >&2
              echo "Cloudflare D1 create failed. Check CLOUDFLARE_API_TOKEN D1 Write permission." >&2
              exit 1
            fi

            DB_ID="$(jq -r '.result.uuid // empty' /tmp/d1-create.json)"
          fi

          echo "D1 database ID: ${DB_ID}"

          echo "Discovering KV namespace..."
          curl --fail-with-body --silent --show-error \
            "${AUTH[@]}" \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
            > /tmp/kv-list.json

          if ! jq -e '.success == true' /tmp/kv-list.json >/dev/null; then
            cat /tmp/kv-list.json >&2
            echo "Cloudflare KV list failed. Check Workers KV Storage Read/Write permission." >&2
            exit 1
          fi

          KV_ID="$(jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id' /tmp/kv-list.json | head -n 1)"

          if [ -z "$KV_ID" ]; then
            echo "KV namespace not found; creating $KV_TITLE..."
            curl --fail-with-body --silent --show-error -X POST \
              "${AUTH[@]}" \
              "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              --data "{\"title\":\"${KV_TITLE}\"}" \
              > /tmp/kv-create.json

            if ! jq -e '.success == true' /tmp/kv-create.json >/dev/null; then
              cat /tmp/kv-create.json >&2
              echo "Cloudflare KV create failed. Check Workers KV Storage Write permission." >&2
              exit 1
            fi

            KV_ID="$(jq -r '.result.id // empty' /tmp/kv-create.json)"
          fi

          echo "KV namespace ID: ${KV_ID}"

          if [ -z "$DB_ID" ] || [ -z "$KV_ID" ]; then
            echo "Unable to provision or discover Cloudflare resource IDs." >&2
            exit 1
          fi

          node - "$DB_ID" "$KV_ID" <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          base.d1_databases = [{
            binding: 'DB',
            database_name: 'momentum-production',
            database_id: process.argv[2],
            migrations_dir: 'migrations'
          }];
          base.kv_namespaces = [{
            binding: 'RATE_LIMIT',
            id: process.argv[3]
          }];
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify(base, null, 2));
          NODE

      - name: Apply engine D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        run: npx wrangler d1 migrations apply momentum-production --remote --yes --config wrangler.deploy.json

      - name: Deploy private engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: _private-engine/worker
        run: npx wrangler deploy --config wrangler.deploy.json

      - name: Install private Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOMENTUM_GITHUB_TOKEN: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}
          MOMENTUM_API_KEY_PEPPER: ${{ secrets.MOMENTUM_API_KEY_PEPPER }}
          MOMENTUM_ADMIN_SECRET: ${{ secrets.MOMENTUM_ADMIN_SECRET }}
        working-directory: _private-engine/worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MOMENTUM_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config wrangler.deploy.json
          printf '%s' "$MOMENTUM_API_KEY_PEPPER" | npx wrangler secret put API_KEY_PEPPER --config wrangler.deploy.json
          printf '%s' "$MOMENTUM_ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET --config wrangler.deploy.json

      - name: Deploy public gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx wrangler deploy
