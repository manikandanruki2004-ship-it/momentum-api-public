name: Production Health Checks

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public gateway
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://momentum-api-public.manikandanruki2004.workers.dev"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "$BASE/health" | tee /tmp/gateway.json
          jq -e '.status == "ok" and .service == "momentum-api-public"' /tmp/gateway.json >/dev/null
          for header in strict-transport-security x-content-type-options referrer-policy permissions-policy; do
            curl --fail --silent --show-error --head --retry 3 --retry-delay 2 "$BASE/health" | tr -d '\r' | grep -i "^${header}:" >/dev/null
          done

      - name: Check billing service binding
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://momentum-api-public.manikandanruki2004.workers.dev"
          STATUS="$(curl --silent --show-error --output /tmp/billing.json --write-out '%{http_code}' --retry 3 --retry-delay 2 "$BASE/billing/health")"
          test "$STATUS" = "200"
          jq -e '.status == "ok" and .service == "momentum-billing"' /tmp/billing.json >/dev/null

      - name: Check auth service binding
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://momentum-api-public.manikandanruki2004.workers.dev"
          STATUS="$(curl --silent --show-error --output /tmp/auth-binding.json --write-out '%{http_code}' --retry 3 --retry-delay 2 "$BASE/auth/health")"
          test "$STATUS" = "200"
          jq -e '.status == "ok" and .service == "momentum-auth"' /tmp/auth-binding.json >/dev/null

      - name: Check unauthenticated boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://momentum-api-public.manikandanruki2004.workers.dev"
          STATUS="$(curl --silent --show-error --output /tmp/me.json --write-out '%{http_code}' --retry 3 --retry-delay 2 "$BASE/auth/me")"
          test "$STATUS" = "401"
          jq -e '.error.code == "UNAUTHORIZED"' /tmp/me.json >/dev/null
          STATUS="$(curl --silent --show-error --output /tmp/live.json --write-out '%{http_code}' --retry 3 --retry-delay 2 "$BASE/v1/momentum")"
          test "$STATUS" = "401"
          jq -e '.error.code == "UNAUTHORIZED"' /tmp/live.json >/dev/null

      - name: Check query validation
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://momentum-api-public.manikandanruki2004.workers.dev"
          STATUS="$(curl --silent --show-error --output /tmp/query.json --write-out '%{http_code}' --retry 3 --retry-delay 2 "$BASE/v1/momentum?min_stars=-1")"
          test "$STATUS" = "400"
          jq -e '.error.code == "INVALID_QUERY"' /tmp/query.json >/dev/null
