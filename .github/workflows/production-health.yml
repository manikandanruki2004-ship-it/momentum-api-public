name: Production Health Checks

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public gateway
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://momentum-api-public.manikandanruki2004.workers.dev"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 -D /tmp/gateway.headers "$BASE/health" | tee /tmp/gateway.json
          jq -e '.status == "ok" and .service == "momentum-api-public" and .billing == "service-binding" and .auth == "service-binding"' /tmp/gateway.json >/dev/null
          grep -iq '^strict-transport-security:' /tmp/gateway.headers

      - name: Check billing service binding
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://momentum-api-public.manikandanruki2004.workers.dev"
          STATUS="$(curl --silent --show-error --output /tmp/billing.json --write-out '%{http_code}' --retry 3 --retry-delay 2 "$BASE/billing/health")"
          test "$STATUS" = "200"
          jq -e '.status == "ok" and .service == "momentum-billing"' /tmp/billing.json >/dev/null

      - name: Check auth service binding
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://momentum-api-public.manikandanruki2004.workers.dev"
          STATUS="$(curl --silent --show-error --output /tmp/auth-config.json --write-out '%{http_code}' --retry 3 --retry-delay 2 "$BASE/auth/config")"
          test "$STATUS" = "200"
          jq -e '.google_client_id | strings | length > 0' /tmp/auth-config.json >/dev/null

      - name: Check unauthenticated boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://momentum-api-public.manikandanruki2004.workers.dev"
          STATUS="$(curl --silent --show-error --output /tmp/me.json --write-out '%{http_code}' --retry 3 --retry-delay 2 "$BASE/auth/me")"
          test "$STATUS" = "401"
          jq -e '.error.code == "UNAUTHORIZED" and (.error.request_id | strings | length > 0)' /tmp/me.json >/dev/null
          STATUS="$(curl --silent --show-error --output /tmp/live.json --write-out '%{http_code}' --retry 3 --retry-delay 2 "$BASE/v1/momentum")"
          test "$STATUS" = "401"
          jq -e '.error.code == "UNAUTHORIZED" and (.error.request_id | strings | length > 0)' /tmp/live.json >/dev/null
