name: Repair Billing Checkout Persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-billing-checkout-persistence.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Patch billing checkout persistence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('billing/src/index.ts')
          s = p.read_text()
          old = '''  await storeUnclaimed(env, data.id, null, env.RAZORPAY_PRO_PLAN_ID, "created", null, null, Math.floor(Date.now() / 1000), normalizeEmail(customer.email));
  return json({ status: "created", subscription_id: data.id, checkout_url: data.short_url }, 201, { "x-request-id": id, "cache-control": "no-store" });'''
          new = '''  // Razorpay has already created the subscription at this point. Do not turn a
  // successful Razorpay creation into a generic 503 just because the local D1
  // bookkeeping fails. The authoritative webhook can persist and reconcile the
  // subscription after the customer authorizes it.
  try {
    await storeUnclaimed(env, data.id, null, env.RAZORPAY_PRO_PLAN_ID, "created", null, null, Math.floor(Date.now() / 1000), normalizeEmail(customer.email));
  } catch (error) {
    console.error("subscription persistence failed after Razorpay creation", { subscription_id: data.id, error });
  }
  return json({ status: "created", subscription_id: data.id, checkout_url: data.short_url }, 201, { "x-request-id": id, "cache-control": "no-store" });'''
          if old not in s:
              raise SystemExit('Expected checkout persistence block was not found; refusing to modify the file')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add billing/src/index.ts
          if git diff --cached --quiet; then
            echo 'Billing source already contains the persistence fix.'
          else
            git commit -m 'Prevent checkout failure when local D1 persistence fails'
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create billing Worker config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.cloudflare.com/client/v4'
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          curl --fail-with-body --silent --show-error "${AUTH[@]}" "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" > /tmp/d1.json
          DB_ID="$(jq -r '.result[] | select(.name == "momentum-production") | .uuid' /tmp/d1.json | head -n 1)"
          test -n "$DB_ID"
          cat > billing/wrangler.deploy.json <<EOF
          {
            "name": "momentum-billing",
            "main": "src/index.ts",
            "compatibility_date": "2026-08-25",
            "workers_dev": true,
            "observability": {"enabled": true},
            "d1_databases": [{"binding":"DB","database_name":"momentum-production","database_id":"$DB_ID"}]
          }
          EOF

      - name: Install billing dependencies
        working-directory: billing
        run: npm install --no-audit --no-fund

      - name: Typecheck billing
        working-directory: billing
        run: npm run typecheck

      - name: Deploy patched billing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_TEST_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_TEST_WEBHOOK_SECRET }}
          RAZORPAY_PRO_PLAN_ID: ${{ secrets.RAZORPAY_PRO_PLAN_ID }}
          RAZORPAY_TEST_PRO_PLAN_ID: ${{ secrets.RAZORPAY_TEST_PRO_PLAN_ID }}
          MOMENTUM_API_KEY_PEPPER: ${{ secrets.MOMENTUM_API_KEY_PEPPER }}
        working-directory: billing
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.deploy.json
          if [ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ]; then printf '%s' "$RAZORPAY_WEBHOOK_SECRET" | npx wrangler secret put RAZORPAY_WEBHOOK_SECRET --config wrangler.deploy.json; fi
          if [ -n "${RAZORPAY_TEST_WEBHOOK_SECRET:-}" ]; then printf '%s' "$RAZORPAY_TEST_WEBHOOK_SECRET" | npx wrangler secret put RAZORPAY_TEST_WEBHOOK_SECRET --config wrangler.deploy.json; fi
          if [ -n "${RAZORPAY_PRO_PLAN_ID:-}" ]; then printf '%s' "$RAZORPAY_PRO_PLAN_ID" | npx wrangler secret put RAZORPAY_PRO_PLAN_ID --config wrangler.deploy.json; fi
          if [ -n "${RAZORPAY_TEST_PRO_PLAN_ID:-}" ]; then printf '%s' "$RAZORPAY_TEST_PRO_PLAN_ID" | npx wrangler secret put RAZORPAY_TEST_PRO_PLAN_ID --config wrangler.deploy.json; fi
          if [ -n "${MOMENTUM_API_KEY_PEPPER:-}" ]; then printf '%s' "$MOMENTUM_API_KEY_PEPPER" | npx wrangler secret put API_KEY_PEPPER --config wrangler.deploy.json; fi
