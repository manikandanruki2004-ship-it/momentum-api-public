name: Repair Billing Checkout Persistence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-billing-checkout-persistence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Patch billing checkout persistence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("billing/src/index.ts")
          source = path.read_text()

          old = '''  await storeUnclaimed(env, data.id, null, env.RAZORPAY_PRO_PLAN_ID, "created", null, null, Math.floor(Date.now() / 1000), normalizeEmail(customer.email));
  return json({ status: "created", subscription_id: data.id, checkout_url: data.short_url }, 201, { "x-request-id": id, "cache-control": "no-store" });'''

          new = '''  // Razorpay has already created the subscription. A local persistence failure
  // must not hide the valid checkout URL from the customer. The webhook will
  // reconcile the subscription after authorization.
  try {
    await storeUnclaimed(env, data.id, null, env.RAZORPAY_PRO_PLAN_ID, "created", null, null, Math.floor(Date.now() / 1000), normalizeEmail(customer.email));
  } catch (error) {
    console.error("subscription persistence failed after Razorpay creation", {
      subscription_id: data.id,
      error,
    });
  }
  return json({ status: "created", subscription_id: data.id, checkout_url: data.short_url }, 201, { "x-request-id": id, "cache-control": "no-store" });'''

          if old not in source:
              raise SystemExit("Expected checkout persistence block was not found")

          path.write_text(source.replace(old, new, 1))
          PY

      - name: Verify source patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'subscription persistence failed after Razorpay creation' billing/src/index.ts
          grep -q 'return json({ status: "created", subscription_id: data.id, checkout_url: data.short_url }' billing/src/index.ts

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add billing/src/index.ts
          if git diff --cached --quiet; then
            echo "Billing source already contains the persistence fix."
          else
            git commit -m "Prevent checkout failure when D1 persistence fails"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: billing/package.json

      - name: Install billing dependencies
        working-directory: billing
        run: npm install --no-audit --no-fund

      - name: Typecheck billing
        working-directory: billing
        run: npm run typecheck
