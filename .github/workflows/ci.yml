name: Momentum CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: momentum-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f CLAUDE.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ENGINEERING-CHECKLIST.md
          test -f docs/PLAN-V2.md
          test -f skills/secure-saas-build/SKILL.md
          set +e
          grep -RniE '(^|[^A-Za-z])(sk-[A-Za-z0-9]{20,}|rk_(live|test)_[A-Za-z0-9]{12,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,})' \
            --exclude-dir=.git \
            --exclude-dir=docs \
            --exclude='*.md' \
            --exclude='*.lock' \
            .
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            echo 'Possible credential/token pattern found in non-documentation source.'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate engineering contract
        run: node tools/validate-engineering.mjs

      - name: Validate billing architecture
        run: node tools/validate-billing-design.mjs

      - name: Install gateway dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Install billing dependencies
        working-directory: billing
        run: npm install --no-audit --no-fund

      - name: Install auth dependencies
        working-directory: auth
        run: npm install --no-audit --no-fund

      - name: Typecheck gateway
        working-directory: worker
        run: npm run typecheck

      - name: Typecheck billing
        working-directory: billing
        run: npm run typecheck

      - name: Test billing provider
        working-directory: billing
        run: npm test

      - name: Typecheck auth
        working-directory: auth
        run: npm run typecheck

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install SDK test dependency
        run: python -m pip install --upgrade pip && pip install httpx
      - name: Compile SDK
        run: python -m compileall sdk
