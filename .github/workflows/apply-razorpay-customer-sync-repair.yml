name: Apply Razorpay Customer ID Sync Repair

# Recovery-only workflow. Normal deployments apply migrations through the
# primary deployment pipeline; this file must never mutate production merely
# because source files changed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply customer ID sync triggers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 d1 execute momentum-production --remote --file=worker/migrations/0016_sync_razorpay_customer_id.sql --yes

      - name: Verify repair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 d1 execute momentum-production --remote --command="SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('trg_sync_razorpay_customer_id_insert','trg_sync_razorpay_customer_id_update') ORDER BY name;" --yes
