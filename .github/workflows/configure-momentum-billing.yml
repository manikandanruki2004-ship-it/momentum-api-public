name: Configure Momentum Billing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build billing deployment config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: billing
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail-with-body --silent --show-error "${AUTH[@]}" "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" > /tmp/d1.json
          DB_ID="$(jq -r '.result[] | select(.name == "momentum-production") | .uuid' /tmp/d1.json | head -n 1)"
          test -n "$DB_ID"
          node - "$DB_ID" <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify({
            name:'momentum-billing', main:'src/index.ts', compatibility_date:'2026-08-25', workers_dev:true,
            observability:{enabled:true},
            d1_databases:[{binding:'DB',database_name:'momentum-production',database_id:process.argv[2]}]
          }, null, 2));
          NODE
      - name: Install Razorpay API credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        working-directory: billing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAZORPAY_KEY_ID"
          test -n "$RAZORPAY_KEY_SECRET"
          printf '%s' "$RAZORPAY_KEY_ID" | npx wrangler secret put RAZORPAY_KEY_ID --config wrangler.deploy.json
          printf '%s' "$RAZORPAY_KEY_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET --config wrangler.deploy.json
          echo "Razorpay API credentials installed in momentum-billing."
