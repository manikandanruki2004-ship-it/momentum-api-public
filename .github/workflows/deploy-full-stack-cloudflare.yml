name: Deploy Momentum Stack to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-full-stack-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: momentum-full-stack-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout public gateway
        uses: actions/checkout@v4
        with:
          path: public

      - name: Checkout private engine
        uses: actions/checkout@v4
        with:
          repository: manikandanruki2004-ship-it/momentum-engine
          token: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}
          path: engine
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            public/worker/package.json
            engine/worker/package.json

      - name: Install engine dependencies
        working-directory: engine/worker
        run: npm install --no-audit --no-fund

      - name: Typecheck private engine
        working-directory: engine/worker
        run: npm run typecheck

      - name: Install public gateway dependencies
        working-directory: public/worker
        run: npm install --no-audit --no-fund

      - name: Typecheck public gateway
        working-directory: public/worker
        run: npm run typecheck

      - name: Deploy private engine first
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: engine/worker
          command: deploy

      - name: Apply private engine D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: engine/worker
          command: d1 migrations apply MOMENTUM_DB --remote --yes

      - name: Install private engine GitHub token
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: engine/worker
          command: secret put GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.MOMENTUM_GITHUB_TOKEN }}

      - name: Install private engine API-key pepper
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: engine/worker
          command: secret put API_KEY_PEPPER
        env:
          API_KEY_PEPPER: ${{ secrets.MOMENTUM_API_KEY_PEPPER }}

      - name: Install private engine admin secret
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: engine/worker
          command: secret put ADMIN_SECRET
        env:
          ADMIN_SECRET: ${{ secrets.MOMENTUM_ADMIN_SECRET }}

      - name: Deploy public gateway second
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: public/worker
          command: deploy
