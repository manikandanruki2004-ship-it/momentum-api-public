openapi: 3.0.3
info:
  title: Momentum API
  version: 1.0.0
  description: Public contract for the Momentum API.
servers:
  - url: https://api.yourdomain.com
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /v1/momentum:
    get:
      summary: Find rising repositories
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: language
          schema: {type: string}
        - in: query
          name: min_stars
          schema: {type: integer, minimum: 0, default: 100}
        - in: query
          name: max_age_days
          schema: {type: integer, minimum: 1, default: 3650}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: Ranked repositories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MomentumResponse'
        '401': {description: Invalid or missing API key}
        '429': {description: Rate limit exceeded}
        '502': {description: GitHub upstream unavailable}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    MomentumItem:
      type: object
      required: [repository, stars, forks, commits_28d, momentum_score, momentum_level]
      properties:
        repository: {type: string}
        stars: {type: integer}
        forks: {type: integer}
        commits_28d: {type: integer}
        momentum_score: {type: number, format: float}
        momentum_level: {type: string, enum: [low, medium, high]}
    MomentumResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/MomentumItem'}
        meta:
          type: object
