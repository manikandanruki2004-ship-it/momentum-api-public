services:
  - type: web
    name: momentum-gateway-staging
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: ENGINE_BASE_URL
        value: https://momentum-engine-staging.onrender.com
      - key: ENGINE_SHARED_SECRET
        fromService:
          type: web
          name: momentum-engine-staging
          envVarKey: WRAPPER_SHARED_SECRET
